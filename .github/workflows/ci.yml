name: ci

# Typecheck, the unit tests and a production build on every pull request and every push to main. The build catches what tsc does not
# (a file named layout.ts under src/app is a route layout to Next, and only `next build` says so).
# The tests need no secrets and no network: the email,
# password-reset and join-form flows run against a real Postgres inside the test process (PGlite), with the mail provider faked.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # the Tengoku search model's postinstall downloads CUDA binaries; nothing here uses them
      ONNXRUNTIME_NODE_INSTALL: skip
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm exec next build # not `pnpm build`: that first warms the search model, which nothing here needs
