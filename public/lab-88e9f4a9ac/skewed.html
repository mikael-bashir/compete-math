function draw(w, h, t, md) { setFrame(w, h, t, md); gl.viewport(0, 0, w, h); gl.drawArrays(gl.TRIANGLES, 0, 3); }

// ---------- live view ----------
const cv = document.getElementById('c'), h1 = document.getElementById('h1'), h2 = document.getElementById('h2');
let last = performance.now(), acc = 0, nf = 0, stepsEst = null;
function frame(now) {
  if (!benchBusy) {
    const dpr = Math.min(devicePixelRatio || 1, 2), w = Math.floor(cv.clientWidth * dpr), h = Math.floor(cv.clientHeight * dpr);
    if (cv.width !== w || cv.height !== h) { cv.width = w; cv.height = h; }
    gl.bindFramebuffer(gl.FRAMEBUFFER, null); gl.drawBuffers([gl.BACK]);
    draw(w, h, now / 1000, mode);
    acc += now - last; nf++;
    if (acc > 500) { h2.textContent = `${(1000 * nf / acc).toFixed(0)} fps \u00b7 ${W.N} skewed waves`; acc = 0; nf = 0; }
  }

}
const NAMES = ['naive march', 'sphere trace, heuristic', 'certified', '', 'certified + overlap', '', 'multi-scale + overlap', 'multi-scale'];
function label() { h1.innerHTML = `<b>${NAMES[mode]}</b>${lod ? ' \u00b7 LOD' : ''}`; }
document.querySelectorAll('#bar [data-m]').forEach(b => b.onclick = () => { mode = +b.dataset.m; document.querySelectorAll('#bar [data-m]').forEach(x => x.classList.toggle('on', x === b)); label(); });
document.getElementById('lod').onclick = e => { lod = lod ? 0 : 1; e.target.classList.toggle('on', !!lod); label(); };
label();

// ---------- benchmark: the same frame, rendered four ways, compared with the dense reference ----------
async function bench() {
  benchBusy = true; const res = document.getElementById('res'); res.style.display = 'block'; res.textContent = 'measuring\u2026';
  await new Promise(r => setTimeout(r, 30));
  const w = 640, h = 360, T = 12.5, tg = target(w, h), n = w * h;
  const read = (md, lodOn) => {
    const keep = lod; lod = lodOn; gl.bindFramebuffer(gl.FRAMEBUFFER, tg.f); gl.drawBuffers([gl.COLOR_ATTACHMENT0, gl.COLOR_ATTACHMENT1]); draw(w, h, T, md); lod = keep;
    const c = new Uint8Array(n * 4); gl.readBuffer(gl.COLOR_ATTACHMENT0); gl.readPixels(0, 0, w, h, gl.RGBA, gl.UNSIGNED_BYTE, c);
    const i = new Float32Array(n * 4); gl.readBuffer(gl.COLOR_ATTACHMENT1); gl.readPixels(0, 0, w, h, gl.RGBA, gl.FLOAT, i); return { c, i };
  };
  const refSS = (T2) => { const w2 = w * 2, h2 = h * 2, t2 = target(w2, h2); gl.bindFramebuffer(gl.FRAMEBUFFER, t2.f); gl.drawBuffers([gl.COLOR_ATTACHMENT0, gl.COLOR_ATTACHMENT1]); const keep = lod; lod = 0; draw(w2, h2, T2, 3); lod = keep; const c = new Uint8Array(w2 * h2 * 4); gl.readBuffer(gl.COLOR_ATTACHMENT0); gl.readPixels(0, 0, w2, h2, gl.RGBA, gl.UNSIGNED_BYTE, c); const o = new Float32Array(n * 4); for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) for (let k = 0; k < 3; k++) { let a = 0; for (let dy = 0; dy < 2; dy++) for (let dx = 0; dx < 2; dx++) a += c[((2 * y + dy) * w2 + 2 * x + dx) * 4 + k]; o[(y * w + x) * 4 + k] = a / 4; } return o; };
  const scenes = [['calm sea, camera 6 m', 1.0, 6.0], ['rough sea, camera 2.5 m', 2.2, 2.5], ['storm, camera 1.5 m', 3.2, 1.5]];
  const cases = [[0, 1, 'naive march'], [0, 0, 'naive march, no LOD'], [2, 0, 'certified'], [4, 0, 'certified + overlap'], [7, 0, 'multi-scale'], [6, 0, 'multi-scale + overlap'], [4, 1, 'certified + overlap + smooth LOD']];
  const out = []; let html = '';
  const keepSea = sea, keepCam = camH;
  for (const [sname, sv, cv2] of scenes) {
    sea = sv; camH = cv2;
    const ref = read(3, 0); const refImg = refSS(T); const rows = [];
    for (const [md, lodOn, name] of cases) {
      const r = read(md, lodOn); let steps = 0, miss = 0, wrong = 0, se = 0, refHits = 0;
      for (let p = 0; p < n; p++) {
        const tr = ref.i[p * 4], tm = r.i[p * 4]; steps += r.i[p * 4 + 2];
        if (tr >= 0) { refHits++; if (tm < 0) miss++; else if (Math.abs(tm - tr) > 0.03 * tr + 0.05) wrong++; } else if (tm >= 0) wrong++;
        for (let k = 0; k < 3; k++) { const dd = r.c[p * 4 + k] - refImg[p * 4 + k]; se += dd * dd; }
      }
      const psnr = 10 * Math.log10(255 * 255 / (se / (n * 3) + 1e-9));
      const tw = 1280, th = 720, tt = target(tw, th); gl.bindFramebuffer(gl.FRAMEBUFFER, tt.f); gl.drawBuffers([gl.COLOR_ATTACHMENT0, gl.COLOR_ATTACHMENT1]);
      const keep = lod; lod = lodOn; const px = new Uint8Array(4);
      draw(tw, th, T, md); gl.readPixels(0, 0, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, px);
      const t0 = performance.now(); for (let k = 0; k < 12; k++) draw(tw, th, T + k * 0.01, md); gl.readPixels(0, 0, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, px);
      const ms = (performance.now() - t0) / 12; lod = keep;
      rows.push({ name, steps: steps / n, miss: 100 * miss / Math.max(refHits, 1), wrong: 100 * wrong / n, psnr, ms });
    }
    let refSteps = 0; for (let p = 0; p < n; p++) refSteps += ref.i[p * 4 + 2];
    out.push({ scene: sname, rows, refSteps: refSteps / n });
    html += `<table><tr><th>${sname}</th><th>steps/px</th><th>ms @720p</th><th>missed</th><th>wrong hit</th><th>PSNR</th></tr>` +
      rows.map(r => `<tr><td>${r.name}</td><td>${r.steps.toFixed(1)}</td><td>${r.ms.toFixed(2)}</td><td>${r.miss.toFixed(2)}%</td><td>${r.wrong.toFixed(2)}%</td><td>${r.psnr.toFixed(1)} dB</td></tr>`).join('') + '</table>';
  }
  sea = keepSea; camH = keepCam;
  window.__bench = out;
  res.innerHTML = html + `<p>The reference is a dense march (0.3% of the distance per step, then bisection) with all ${W.N} waves and no LOD. "missed": the reference hits water and the method sees sky; "wrong hit": hit distance off by more than 3%.</p>`;
  benchBusy = false;
}
document.getElementById('bench').onclick = bench;
requestAnimationFrame(frame);
</script>
<script>
// the benchmark panel: a close button (re-added whenever the page rewrites the panel) and Escape
(function () {
  var r = document.getElementById('res'); if (!r) return;
  function add() {
    if (r.querySelector('.resx')) return;
    var b = document.createElement('button'); b.className = 'resx'; b.type = 'button'; b.textContent = '\u00d7'; b.setAttribute('aria-label', 'Close results');
    b.onclick = function () { r.style.display = 'none'; }; r.insertBefore(b, r.firstChild);
  }
